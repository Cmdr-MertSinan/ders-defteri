<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080B16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neo Class for Mert" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Neo Class for Mert</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"><div class="empty">Neo Class for Mert açılıyor…</div></div>
    <script>
      (function () {
        var stamp = Date.now();
        function addStyle(href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href + "?t=" + stamp;
          document.head.appendChild(link);
        }
        function addScript(src) {
          return new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = src + "?t=" + stamp;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });
        }
        addStyle("styles.css");
        addScript("vendor/pdf.min.js")
          .then(function () { return addScript("vendor/jszip.min.js"); })
          .then(function () { return addScript("vendor/html2pdf.bundle.min.js"); })
          .then(function () { return addScript("js/db.js"); })
          .then(function () { return addScript("js/extract.js"); })
          .then(function () { return addScript("js/summarize.js"); })
          .then(function () { return addScript("js/app.js"); })
          .catch(function () {
            document.getElementById("app").innerHTML =
              '<div class="empty">Sayfa yüklenemedi. Bu linki tekrar aç: https://cmdr-mertsinan.github.io/ders-defteri/</div>';
          });
      })();
    </script>
  </body>
</html>
