name: Sync notes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Merge incoming notes
        env:
          NTFY_TOPIC: neoclass-2ea2b0e3de749c573fd60ad016c8061f
        run: python3 scripts/sync-notes-from-ntfy.py
      - name: Commit notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/user-state.json
          if git diff --cached --quiet; then
            echo "no_commit"
            exit 0
          fi
          git commit -m "Sync notes from phone and computer."
          git push
